<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine Dining Lab · 分子级摆盘工坊</title>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#111013; --panel:#131215; --panel2:#1a191d;
    --line:#2a2830; --gold:#c8a15a; --gold2:#e8c884; --txt:#ece7dc;
    --muted:#8a8578; --ok:#7ac77a; --warn:#e0954a; --danger:#e06a5a; --info:#7a9ad0;
    --serif:'Cormorant Garamond','Songti SC','Georgia','Times New Roman',serif;
    --display:'Cormorant Garamond','Baskerville','Songti SC','STSong',serif;
    --sans:'Helvetica Neue','PingFang SC','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"liga" 1,"kern" 1}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:#2e2c34;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:grid;grid-template-columns:280px 1fr 320px;grid-template-rows:56px 1fr;height:100vh}
  header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:linear-gradient(180deg,#151317,#0e0d10);border-bottom:1px solid var(--line);z-index:10}
  header .brand{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:5px;color:var(--gold2)}
  header .brand small{font-family:var(--sans);font-size:10px;letter-spacing:2px;color:var(--muted);margin-left:10px;font-weight:400}
  header .ctx{display:flex;gap:8px;align-items:center}
  .chip{font-size:12px;padding:5px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.15s;font-family:var(--sans)}
  .chip:hover{border-color:var(--gold);color:var(--gold2)}
  .chip.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}

  /* LEFT pantry */
  #pantry{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #search{margin:12px;padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px;outline:none}
  #search:focus{border-color:var(--gold)}
  #pantry-list{flex:1;overflow-y:auto;padding:0 10px 16px}
  #cat-filter{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .catchip{font-size:11px;padding:4px 9px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.14s;white-space:nowrap}
  .catchip:hover{border-color:var(--gold);color:var(--gold2)}
  .catchip.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}
  .ing .fav{width:18px;height:18px;flex:none;font-size:13px;line-height:1;color:#4a4740;cursor:pointer;text-align:center;transition:.14s}
  .ing .fav:hover{color:var(--gold2);transform:scale(1.2)}
  .ing .fav.on{color:var(--gold2)}
  .cat-h{font-family:var(--serif);font-size:13px;letter-spacing:1px;color:var(--gold);margin:14px 6px 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .ing{display:flex;align-items:center;gap:9px;padding:7px 9px;margin:3px 0;border-radius:8px;background:var(--panel2);border:1px solid transparent;cursor:pointer;transition:.14s}
  .ing:hover{border-color:var(--gold);transform:translateX(3px)}
  .ing .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
  .ing .nm{font-size:12.5px;flex:1;line-height:1.2}
  .ing .tier{font-size:9px;padding:1px 6px;border-radius:8px;background:#000;color:var(--muted)}
  .ing .tier.premium{color:var(--gold2)} .ing .tier.rare{color:var(--danger)}

  /* CENTER stage */
  #stage{position:relative;background:radial-gradient(ellipse at 50% 38%,#17151a 0%,#0a0a0c 72%);display:flex;flex-direction:column;overflow:hidden}
  #stage-3d{flex:1;position:relative}
  #stage-3d canvas{display:block;width:100%;height:100%}
  #stage-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;text-align:center}
  #stage-empty .big{font-family:var(--serif);font-size:26px;color:#4a4740;letter-spacing:2px}
  #ctrlbar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:linear-gradient(0deg,#100f12,transparent);z-index:5;flex-wrap:wrap}
  .btn{font-size:12px;padding:7px 14px;border-radius:20px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);cursor:pointer;transition:.15s;font-family:var(--sans)}
  .btn:hover{border-color:var(--gold);color:var(--gold2)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#a07d3a);color:#1a1408;border:none;font-weight:600}
  .btn.gold:hover{filter:brightness(1.1)}
  #vessel-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#0d0c0f;border-top:1px solid var(--line)}
  .vchip{flex:none;font-size:11px;padding:6px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.14s}
  .vchip:hover{border-color:var(--gold)} .vchip.on{background:var(--gold);color:#1a1408;font-weight:600;border-color:var(--gold)}

  /* RIGHT creation card */
  #card{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #card-scroll{flex:1;overflow-y:auto;padding:16px}
  .card-title{font-family:var(--serif);font-size:15px;letter-spacing:1px;color:var(--gold);margin-bottom:10px}
  #dish-name{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:1px;color:var(--txt);margin-bottom:4px;min-height:26px;cursor:pointer}
  #dish-name:hover{color:var(--gold2)}
  #dish-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
  #score-wrap{text-align:center;padding:12px;background:var(--panel2);border-radius:12px;margin-bottom:14px;border:1px solid var(--line)}
  #score{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1;color:var(--gold2)}
  #score-lbl{font-size:10px;letter-spacing:1px;color:var(--muted);margin-top:2px}
  #stars{font-size:13px;margin-top:6px;letter-spacing:2px}
  .layer{display:flex;align-items:center;gap:9px;padding:8px;margin:5px 0;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
  .layer .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .layer .li-nm{flex:1;font-size:12.5px}
  .layer .li-t{font-size:10px;color:var(--muted)}
  .layer .tech-sel{font-size:10px;background:var(--bg);color:var(--gold2);border:1px solid var(--line);border-radius:6px;padding:2px 4px;max-width:96px}
  .layer .rm{width:22px;height:22px;border-radius:50%;background:#000;color:var(--danger);border:1px solid var(--line);cursor:pointer;font-size:13px;line-height:1;flex:none}
  .layer .rm:hover{background:var(--danger);color:#fff}
  #notes{margin:12px 0;font-size:11.5px;line-height:1.6}
  .note{padding:5px 8px;margin:3px 0;border-radius:6px;border-left:3px solid}
  .note.ok{border-color:var(--ok);background:rgba(122,199,122,.08);color:#a8d8a8}
  .note.warn{border-color:var(--warn);background:rgba(224,149,74,.08);color:#e8b884}
  .note.avoid{border-color:var(--danger);background:rgba(224,106,90,.1);color:#e89888}
  .note.tip{border-color:var(--info);background:rgba(122,154,208,.08);color:#a8bce0}
  #ai-tip{font-size:12px;line-height:1.6;color:var(--gold2);min-height:18px;margin-top:8px;font-style:italic}
  #radar-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 6px;margin-bottom:14px}
  #radar-wrap .card-title{margin-bottom:4px}
  #flavor-radar{display:flex;justify-content:center}
  #flavor-radar svg{width:100%;max-width:240px;height:auto}
  #critique{background:linear-gradient(180deg,rgba(200,161,90,.07),transparent);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px;margin-bottom:12px;display:none}
  #critique.on{display:block}
  #critique .cq-verdict{font-family:var(--serif);font-size:15px;color:var(--gold2);margin-bottom:6px}
  #critique .cq-line{font-size:12px;line-height:1.65;color:var(--txt);margin:3px 0}
  #critique .cq-line b{color:var(--gold2);font-weight:600}
  #critique .cq-tag{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
  #card-actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

  /* match modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
  #modal.on{display:flex}
  .modal-box{width:min(560px,92vw);max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#17151a,#100f12);border:1px solid var(--gold);border-radius:16px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .modal-box .mlabel{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .modal-box h2{font-family:var(--serif);font-size:28px;color:var(--gold2);margin:6px 0}
  .modal-box .rest{font-size:13px;color:var(--txt);margin-bottom:2px}
  .modal-box .meta{font-size:11px;color:var(--muted);margin-bottom:16px}
  .modal-box .story{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--txt);border-left:2px solid var(--gold);padding-left:14px;margin:14px 0}
  .modal-box .sim{font-size:12px;color:var(--muted);margin-top:14px}
  .modal-box .close{margin-top:18px}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:2px}
  .menu-list{margin-top:12px;display:flex;flex-direction:column;gap:2px}
  .menu-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
  .menu-row .mr-main{flex:1;min-width:0}
  .menu-row .mr-name{font-family:var(--serif);font-size:19px;color:var(--txt)}
  .menu-row .mr-ing{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-row .mr-meta{font-size:11px;color:var(--gold);margin-top:3px}
  .menu-row .mr-btns{display:flex;gap:6px;flex:none}
  .menu-row .mr-btns .btn{padding:5px 10px;font-size:11px}

  /* B4: mobile / narrow-screen responsive */
  #mobile-nav{display:none}
  @media (max-width:820px){
    html,body{overflow:auto;height:auto}
    #app{display:block;height:auto}
    header{position:sticky;top:0;flex-wrap:wrap;gap:6px;padding:8px 14px;height:auto}
    header .brand{font-size:19px;letter-spacing:3px}
    header .ctx{flex-wrap:wrap}
    /* bottom tab bar to switch the three panels */
    #mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0e0d10;border-top:1px solid var(--line)}
    #mobile-nav button{flex:1;padding:11px 0;background:none;border:none;color:var(--muted);font-size:12px;font-family:var(--sans);border-top:2px solid transparent}
    #mobile-nav button.on{color:var(--gold2);border-top-color:var(--gold)}
    #pantry,#stage,#card{border:none;border-bottom:1px solid var(--line)}
    /* panel visibility driven by body[data-m] */
    #pantry,#card{display:none}
    #stage{display:flex;min-height:64vh}
    body[data-m="pantry"] #pantry{display:flex} body[data-m="pantry"] #stage,body[data-m="pantry"] #card{display:none}
    body[data-m="stage"] #stage{display:flex} body[data-m="stage"] #pantry,body[data-m="stage"] #card{display:none}
    body[data-m="card"] #card{display:flex} body[data-m="card"] #stage,body[data-m="card"] #pantry{display:none}
    #pantry,#card{max-height:calc(100vh - 108px)}
    #stage-3d{min-height:52vh}
    #card-scroll{padding-bottom:70px}
    #pantry-list{padding-bottom:70px}
    #flavor-radar svg{max-width:280px}
    .modal-box{padding:20px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">FINE DINING LAB<small>分子级摆盘工坊 · 有据的创新</small></div>
    <div class="ctx">
      <span style="font-size:11px;color:var(--muted);margin-right:4px">时令</span>
      <div id="season-chips" class="ctx"></div>
    </div>
  </header>

  <!-- LEFT -->
  <aside id="pantry">
    <input id="search" placeholder="🔍 搜索食材 / 风味 / 出处…">
    <div id="cat-filter"></div>
    <div id="pantry-list"></div>
  </aside>

  <!-- CENTER -->
  <main id="stage">
    <div id="stage-3d">
      <div id="stage-empty"><div class="big">空盘</div><div style="margin-top:8px;font-size:12px">从左侧素材库点选食材,开始你的创作</div></div>
    </div>
    <div id="ctrlbar">
      <button class="btn" data-act="rotate">↻ 自动旋转</button>
      <button class="btn" data-act="clear">清空重来</button>
      <button class="btn" data-act="random">🎲 主厨随机灵感</button>
      <button class="btn" data-act="demo">📖 加载名厨示范菜</button>
      <button class="btn" data-act="menu">📔 我的菜单</button>
      <span style="flex:1"></span>
      <span id="layer-count" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div id="vessel-strip"></div>
  </main>

  <!-- RIGHT -->
  <aside id="card">
    <div id="card-scroll">
      <div class="card-title">创作卡 · THE DISH</div>
      <div id="dish-name">未命名之作</div>
      <div id="dish-sub">点击命名 · 或让主厨随机生成</div>
      <div id="score-wrap">
        <div id="score">—</div>
        <div id="score-lbl">合理性评分</div>
        <div id="stars"></div>
      </div>
      <div id="radar-wrap">
        <div class="card-title" style="font-size:12px">风味平衡 · FLAVOR PROFILE</div>
        <div id="flavor-radar"></div>
      </div>
      <div id="critique"></div>
      <div class="card-title" style="font-size:12px">层次 · LAYERS</div>
      <div id="layers"></div>
      <div id="notes"></div>
      <div id="ai-tip"></div>
    </div>
    <div id="card-actions">
      <button class="btn gold" data-act="ai">✨ 让 AI 给我灵感</button>
      <button class="btn gold" data-act="match">🍽 找到最相近的名厨菜品</button>
      <button class="btn" data-act="save">＋ 收进菜单</button>
      <button class="btn" data-act="export-dish">⬇ 导出菜品图(手机版)</button>
    </div>
  </aside>
</div>

<!-- B4: mobile bottom nav -->
<nav id="mobile-nav">
  <button data-m="pantry">🧺 素材</button>
  <button data-m="stage" class="on">🍽 摆盘</button>
  <button data-m="card">📝 创作卡</button>
</nav>

<!-- match modal -->
<div id="modal"><div class="modal-box" id="modal-body"></div></div>

<script>
/* =====================================================================
   Fine Dining Lab — Screen-Print (halftone) art engine
   Pure SVG-string generators. No canvas, no 3D. Every ingredient / vessel
   returns an SVG <g> group of layered Ben-Day halftone screens, so the same
   code renders the widget previews AND the final page.

   Design language (approved sample):
   - dark Michelin background, spotlight + focus vignette
   - visible halftone dots; tone encoded by dot radius per screen
   - limited elegant palette, off-register overprint, registration marks
   ===================================================================== */
(function (root) {
  'use strict';

  // ---- palette (screen-print inks) ----
  const INK = {
    paper:'#161310', plate:'#2a2622', plateWell:'#1b1815',
    cream:'#efe3cf', creamDot:'#d8b98a',
    gold:'#e5c07a',  goldDot:'#a9711f',
    sear:'#c58a3a',  searDot:'#5e3212',
    flesh:'#f0d9c4', fleshDot:'#c98f6a',
    coral:'#e8927a', coralDot:'#a24634',
    rose:'#e7b6bd',  roseDot:'#b06a72',
    crimson:'#b5384a',crimsonDot:'#6e1622',
    teal:'#2f5b52',  tealDot:'#4f8f82',
    green:'#3f6f3a', greenDot:'#6aa martial',
    olive:'#7a8a3a', oliveDot:'#4a5a1a',
    ink:'#26262b',   inkDot:'#050506',
    ivory:'#e8e2d2', ivoryDot:'#b8b09a',
    amber:'#d8a24a', amberDot:'#8a5a1a',
    beet:'#7a2a44',  beetDot:'#4a1226',
    orange:'#e08840',orangeDot:'#9a4a12',
    violet:'#6a4a7a', violetDot:'#3a2450'
  };
  // fix a typo-safe green dot
  INK.greenDot = '#6aa84a';

  // ---- halftone pattern registry: one <pattern> per (fill,dot,size,angle) ----
  let _patSeq = 0;
  const _patCache = new Map();
  function halftone(fill, dot, size, angle) {
    // resolve palette key names (e.g. 'cream','creamDot') to hex; pass through literal colors
    fill = INK[fill] || fill;
    dot  = INK[dot]  || dot;
    const kkey = fill + '|' + dot + '|' + size + '|' + angle;
    if (_patCache.has(kkey)) return _patCache.get(kkey);
    const id = 'ht' + (_patSeq++);
    const r = (size * 0.5 * 0.92).toFixed(2);
    const c = (size / 2).toFixed(2);
    const def =
      `<pattern id="${id}" width="${size}" height="${size}" patternUnits="userSpaceOnUse" patternTransform="rotate(${angle})">` +
      `<rect width="${size}" height="${size}" fill="${fill}"/>` +
      `<circle cx="${c}" cy="${c}" r="${r}" fill="${dot}"/></pattern>`;
    const rec = { id, def, url: `url(#${id})` };
    _patCache.set(kkey, rec);
    return rec;
  }

  // Collect all defs emitted so far (patterns + gradients + filters)
  const _extraDefs = [];
  function pushDef(s){ _extraDefs.push(s); }
  function collectDefs() {
    const pats = Array.from(_patCache.values()).map(p => p.def).join('');
    return pats + _extraDefs.join('');
  }
  function resetDefs(){ _patCache.clear(); _extraDefs.length = 0; _patSeq = 0; }

  // ---- helpers ----
  // If `extra` already carries a fill= (e.g. stroke-only paths passing fill="none"),
  // DON'T also emit the positional fill — a duplicate `fill` attribute makes strict
  // SVG parsers reject the document, which breaks <img>/canvas export in the browser.
  function _fillAttr(fill, extra){ return /(^|\s)fill\s*=/.test(extra) ? '' : `fill="${fill}"`; }
  function ell(cx,cy,rx,ry,fill,extra=''){ return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${_fillAttr(fill,extra)} ${extra}/>`; }
  function path(d,fill,extra=''){ return `<path d="${d}" ${_fillAttr(fill,extra)} ${extra}/>`; }
  function circle(cx,cy,r,fill,extra=''){ return `<circle cx="${cx}" cy="${cy}" r="${r}" ${_fillAttr(fill,extra)} ${extra}/>`; }
  // specular highlight arc, light from upper-left
  function hi(cx,cy,rx,op=0.5){ return `<path d="M${cx-rx} ${cy} Q${cx} ${cy-rx*0.5} ${cx+rx} ${cy}" stroke="#fff5df" stroke-width="3" fill="none" opacity="${op}" stroke-linecap="round"/>`; }
  // scatter of small filled dots (for grain / caviar sparkle / seeds)
  function scatter(cx,cy,rx,ry,n,r,fill,seed=1){
    let s=''; let x=seed*9301+49297;
    const rnd=()=>{x=(x*9301+49297)%233280; return x/233280;};
    for(let i=0;i<n;i++){const a=rnd()*6.283,rr=Math.sqrt(rnd());
      const px=cx+Math.cos(a)*rx*rr, py=cy+Math.sin(a)*ry*rr;
      s+=circle(px.toFixed(1),py.toFixed(1),(r*(0.7+rnd()*0.6)).toFixed(1),fill);}
    return s;
  }

  root.FDL_ART = {
    INK, halftone, collectDefs, resetDefs, pushDef,
    _h:{ell,path,circle,hi,scatter}
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* =====================================================================
   Fine Dining Lab — Ingredient art library (halftone screen-print)
   One draw fn per ingredient id. Each returns an SVG <g> string, drawn
   from the ingredient's REAL fine-dining reference (form / cut / colour),
   centred at (0,0) in a ~ -60..60 local box; the page scales & places it.
   Requires FDL_ART.
   ===================================================================== */
(function (root) {
  'use strict';
  const A = root.FDL_ART;
  const { ell, path, circle, hi } = A._h;
  const scatter = A._h.scatter;
  const H = A.halftone, INK = A.INK;

  function screen(d, fill, dot, size, angle, extra='') {
    return path(d, H(fill, dot, size, angle).url, extra);
  }
  function screenEll(cx,cy,rx,ry, fill,dot,size,angle, extra=''){
    return ell(cx,cy,rx,ry, H(fill,dot,size,angle).url, extra);
  }
  const g = (inner, tf='') => `<g ${tf?`transform="${tf}"`:''}>${inner}</g>`;

  /* ---------- shared shape helpers ---------- */
  function leaf(cx,cy,w,h,rot,inkName){

<script>
/* =====================================================================
   Fine Dining Lab — Flavor-Compound Model (food-pairing hypothesis)
   ---------------------------------------------------------------------
   Grounded in the "flavor network" work (Ahn, Ahnert, Bagrow, Barabási,
   Scientific Reports 2011) and Foodpairing's aroma-molecule approach:
   ~80% of flavor is volatile aroma; two ingredients tend to pair when they
   SHARE characteristic aroma-compound families (Western logic), and can also
   pair by deliberate CONTRAST (East-Asian logic).

   We model each ingredient with a small set of aroma-compound FAMILIES.
   Affinity(a,b) = weighted overlap of their families -> an explainable,
   data-driven pairing score over ALL 81 ingredients (not a hand list).
   Curated, not lab-measured — but every family assignment is defensible
   from the ingredient's real aroma profile.
   ===================================================================== */
(function (root) {
  'use strict';

  // aroma-compound families: id -> {label, note (what it smells/tastes of)}
  const FAMILIES = {
    pyrazine:  {label:'吡嗪·烘烤', note:'烘烤/坚果/焦香 — 美拉德与焙炒产生'},
    lactone:   {label:'内酯·奶脂', note:'奶油/椰香/桃李 — 乳脂与熟果'},
    terpene:   {label:'萜烯·柑橘草本', note:'柑橘/松脂/草本清香'},
    ester:     {label:'酯·果香', note:'水果甜香 — 熟果与发酵'},
    aldehyde:  {label:'醛·青鲜', note:'青草/黄瓜/脂青 — 清新脂感'},
    sulfur:    {label:'含硫·葱蒜海洋', note:'葱蒜/海洋/熟蛋 — 硫化物'},
    phenol:    {label:'酚·烟熏', note:'烟熏/丁香/药香'},
    furanone:  {label:'呋喃酮·焦糖', note:'焦糖/枫糖/烤麦 — 甜焦'},
    maritime:  {label:'溴酚·海洋', note:'碘/海藻/贝类的海洋气息'},
    earthy:    {label:'土壤菌香', note:'土臭素/蘑菇醇 — 菌菇泥土'},
    floral:    {label:'花香', note:'紫罗兰/玫瑰/橙花的花香萜'},
    green:     {label:'青叶', note:'割草/叶醛的青绿气'},
    umami:     {label:'谷氨酸·鲜', note:'谷氨酸/核苷酸鲜味(味觉桥)'},
    animalic:  {label:'肉脂·血', note:'烤肉脂香/铁质血味'}
  };

  // ingredient id -> compound families (2-4 each). Curated from real aroma profiles.
  const ING = {
    // seafood
    scallop:['sulfur','lactone','umami','maritime'],
    langoustine:['maritime','sulfur','umami'],
    uni:['maritime','umami','lactone'],
    oyster:['maritime','sulfur','umami'],
    turbot:['maritime','lactone','umami'],
    king_crab:['maritime','umami','sulfur'],
    caviar:['maritime','umami','sulfur'],
    abalone:['maritime','umami','earthy'],
    amaebi:['maritime','lactone','umami'],
    eel_unagi:['furanone','phenol','animalic','umami'],
    squid:['maritime','umami'],
    sea_bream:['maritime','aldehyde','umami'],
    anchovy:['umami','sulfur','maritime'],
    // meat
    wagyu:['animalic','lactone','furanone','umami'],
    squab:['animalic','pyrazine','earthy'],
    iberico:['animalic','pyrazine','lactone','umami'],
    lamb:['animalic','terpene','phenol'],
    foie_gras:['lactone','animalic','furanone'],
    duck:['animalic','furanone','pyrazine'],
    veal_sweetbread:['pyrazine','lactone','animalic'],
    venison:['animalic','earthy','phenol'],
    beef_tartare:['animalic','umami'],
    short_rib:['animalic','furanone','pyrazine','umami'],
    suckling_pig:['pyrazine','furanone','animalic'],
    quail:['animalic','pyrazine','earthy'],
    rabbit:['animalic','green','terpene'],
    bone_marrow:['animalic','lactone','pyrazine'],
    pork_jowl:['animalic','lactone','umami'],
    // vegetable
    white_asparagus:['sulfur','green','earthy'],
    heirloom_tomato:['umami','green','ester'],
    beetroot:['earthy','furanone'],
    green_pea:['green','aldehyde'],
    celeriac:['earthy','terpene','green'],
    carrot:['terpene','furanone','earthy'],
    corn:['furanone','lactone','umami'],
    potato:['pyrazine','earthy','sulfur'],
    cauliflower:['sulfur','pyrazine','green'],
    cabbage:['sulfur','green'],
    // fungi + truffles (garnish cat but fungal)
    black_truffle:['earthy','sulfur','animalic'],
    white_truffle:['sulfur','earthy','animalic'],
    matsutake:['earthy','terpene','umami'],
    porcini:['earthy','pyrazine','umami'],
    morel:['earthy','pyrazine','phenol'],
    chanterelle:['earthy','ester','terpene'],
    // acid + fruit
    yuzu:['terpene','floral','ester'],
    green_apple:['ester','aldehyde','green'],
    rhubarb:['green','ester'],
    sea_buckthorn:['ester','terpene','aldehyde'],
    lime:['terpene','aldehyde'],
    passion_fruit:['ester','sulfur','terpene'],
    strawberry:['ester','furanone','floral'],
    cherry:['ester','lactone','floral'],
    fig:['ester','furanone','green'],
    grape:['ester','terpene','floral'],
    // dairy
    parmesan:['umami','lactone','pyrazine'],
    burrata:['lactone','umami'],
    egg_yolk:['sulfur','lactone','umami'],
    goat_cheese:['lactone','green','sulfur'],
    // grain
    risotto_rice:['furanone','lactone'],
    buckwheat:['pyrazine','furanone'],
    koji_rice:['furanone','umami','ester'],
    // spice/herb
    saffron:['terpene','furanone','floral'],
    vanilla:['lactone','furanone','floral'],
    dill:['terpene','green'],
    basil:['terpene','phenol','floral'],
    // sauce/base
    kombu_dashi:['umami','maritime'],
    brown_butter:['furanone','lactone','pyrazine'],
    beurre_blanc:['lactone','ester'],
    jus:['animalic','furanone','umami'],
    salsa_verde:['terpene','green','sulfur'],
    ponzu:['terpene','umami','maritime'],
    mole:['pyrazine','phenol','furanone'],
    tigers_milk:['terpene','sulfur','umami'],
    // texture / garnish
    buckwheat_crisp:['pyrazine','furanone'],
    tuile:['furanone','pyrazine'],
    edible_flower:['floral','green'],
    nasturtium:['green','sulfur','terpene'],
    micro_herb:['green','terpene'],
    gold_leaf:[],                        // inert — visual only
    nori_powder:['maritime','umami','sulfur'],
    charcoal_oil:['phenol','pyrazine']
  };

  // weight some families higher when shared (they are stronger "bridges")
  const W = { umami:1.4, maritime:1.3, earthy:1.25, animalic:1.2, pyrazine:1.15, furanone:1.15 };
  const wOf = f => W[f] || 1;

  function families(id){ return ING[id] || []; }

  // shared-compound affinity 0..1 (weighted Jaccard-ish over families)
  function affinity(a, b){
    const A = families(a), B = families(b);
    if(!A.length || !B.length) return 0;
    const setB = new Set(B);
    let shareW = 0, sharedList = [];
    A.forEach(f=>{ if(setB.has(f)){ shareW += wOf(f); sharedList.push(f); } });
    const denom = new Set([...A, ...B]).size || 1;
    const score = shareW / denom;                 // 0..~1.4
    return { score: Math.min(1, score * 1.15), shared: sharedList };
  }

  // recommend the top-N ingredients that best bridge with the current set.
  // Blends: shared-aroma affinity (food-pairing hypothesis) + curated classic
  // pairings (contrast/acid-balance knowledge) + a cross-category nudge so a
  // seafood dish isn't only told to add more seafood.
  // opts: {catOf(id)->cat, classicPairs:Set('a|b'), n}
  function recommend(currentIds, allIds, opts={}){
    const n = opts.n || 6;
    const catOf = opts.catOf || (()=> '');
    const classic = opts.classicPairs || new Set();
    const key=(a,b)=>[a,b].sort().join('|');
    const used = new Set(currentIds);
    const usedCats = new Set(currentIds.map(catOf));
    const cand = allIds.filter(id=>!used.has(id) && families(id).length);
    const scored = cand.map(id=>{
      let best=0, bestVia=[], sum=0, cnt=0, isClassic=false;
      currentIds.forEach(cur=>{
        const {score, shared} = affinity(cur, id);
        if(score>best){ best=score; bestVia=shared; }
        sum+=score; cnt++;
        if(classic.has(key(cur,id))) isClassic=true;
      });
      const avg = cnt? sum/cnt : 0;
      let s = best*0.6 + avg*0.25;
      let via = bestVia, kind = 'aroma';
      if(isClassic){ s = Math.max(s, 0.72) + 0.2; kind='classic'; }   // curated classic bridge
      // cross-category nudge: reward a new category (breadth)
      if(!usedCats.has(catOf(id))) s += 0.06;
      return { id, score:s, via, kind };
    }).filter(x=>x.score>0.1);
    scored.sort((a,b)=>b.score-a.score);
    return scored.slice(0,n);
  }

  root.FDL_FLAVOR = { FAMILIES, families, affinity, recommend };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
const DB = window.FDL_DB;
const byId = id => DB.INGREDIENTS.find(i=>i.id===id) || DB.VESSELS.find(v=>v.id===id);
const techById = id => DB.TECHNIQUES.find(t=>t.id===id);
const ART = window.FDL_ART, ING_ART = window.FDL_ING_ART, VESSEL_ART = window.FDL_VESSEL_ART;

/* ================= STATE ================= */
const state = { season:'winter', vessel:'raw_ceramic', layers:[], name:'未命名之作' };
// layers: [{ing:<id>, tech:<id|null>}]

const MAX_LAYERS = 12;

/* ---- toast ---- */
let _toastT=null;
function toast(msg){
  let el=document.getElementById('fdl-toast');
  if(!el){ el=document.createElement('div'); el.id='fdl-toast';
    el.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1a1712;color:#e8dcc0;border:1px solid #4a4636;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;font-family:var(--sans)';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.style.opacity='0',2200);
}

/* ---- menu store (localStorage) ---- */
const MENU_KEY='fdl_menu_v1';
function loadMenu(){ try{ return JSON.parse(localStorage.getItem(MENU_KEY)||'[]'); }catch(e){ return []; } }
function saveMenu(m){ try{ localStorage.setItem(MENU_KEY, JSON.stringify(m)); }catch(e){} }
function saveCurrentToMenu(){
  if(!state.layers.length){ toast('先做一道菜再收藏'); return; }
  const m=loadMenu();
  const {score}=evaluate();
  m.push({ id:'d'+Date.now(), name:state.name, vessel:state.vessel, season:state.season,
           layers:JSON.parse(JSON.stringify(state.layers)), score, ts:Date.now() });
  saveMenu(m); toast(`已收进菜单 · 共 ${m.length} 道`);
}
function deleteFromMenu(id){ saveMenu(loadMenu().filter(d=>d.id!==id)); openMenu(); }
function loadDishFromMenu(id){
  const d=loadMenu().find(x=>x.id===id); if(!d)return;
  state.layers=JSON.parse(JSON.stringify(d.layers)); state.vessel=d.vessel; state.season=d.season; state.name=d.name;
  renderVessels(); renderContext(); renderCard(); renderStage(); closeModal(); toast('已载入到组装台');
}


/* ================= 2D SCREEN-PRINT COMPOSITOR ================= */
const STAGE_W=760, STAGE_H=560, STAGE_CX=STAGE_W/2, STAGE_CY=STAGE_H/2+10;
let rot = 0;                 // whole-dish rotation angle (degrees)
let autoRotate = true, rotTimer = null;
let _dragLayer = -1;         // index being dragged, or -1

// assign a default fanned position to a newly added layer
function defaultPos(idx, n){
  if(idx===0) return {x:-6,y:10,s:1.15};
  const R=64, Ry=30, i=idx-1, ringN=Math.max(1,n-1);
  const a=(i/ringN)*Math.PI*2 + 0.7;
  return {x:Math.cos(a)*R, y:-8+Math.sin(a)*Ry, s:0.82-i*0.03};
}
// ensure every layer has a pos (older/loaded dishes may lack one)
function ensurePositions(){
  const n=state.layers.length;

/* ---- drag to reposition a layer (pauses auto-rotate) ---- */
function attachDrag(){
  const svg=document.getElementById('fdl-svg'); if(!svg) return;
  // map client px -> svg user units, then subtract plate-center + un-rotate
  function toDish(evt){
    const r=svg.getBoundingClientRect();
    const sx=(evt.clientX-r.left)/r.width*STAGE_W - STAGE_CX;
    const sy=(evt.clientY-r.top)/r.height*STAGE_H - STAGE_CY;
    const a=-rot*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
    return { x:sx*c - sy*s, y:sx*s + sy*c };
  }
  svg.querySelectorAll('.fdl-layer').forEach(g=>{
    g.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      _dragLayer=+g.dataset.layer; autoRotate=false;
      g.setPointerCapture(ev.pointerId); g.style.cursor='grabbing';
    });
    g.addEventListener('pointermove',ev=>{
      if(_dragLayer<0 || +g.dataset.layer!==_dragLayer) return;
      const p=toDish(ev); const L=state.layers[_dragLayer];
      if(L){ L.pos.x=Math.max(-150,Math.min(150,p.x)); L.pos.y=Math.max(-110,Math.min(110,p.y)); renderStage(); }
    });
    const end=ev=>{ if(_dragLayer>=0){ _dragLayer=-1; renderStage(); } };
    g.addEventListener('pointerup',end);
    g.addEventListener('pointercancel',end);
  });
}

function buildVessel(){ renderStage(); }

function startAutoRotate(){
  if(rotTimer) clearInterval(rotTimer);
  rotTimer = setInterval(()=>{ if(autoRotate && state.layers.length>=1 && _dragLayer<0){ rot=(rot+2)%360; renderStage(); } }, 90);
}
function initStage(){ renderStage(); startAutoRotate(); }

/* ---- reasonableness engine ---- */
function evaluate(){
  const ids=state.layers.map(l=>l.ing);
  let score = ids.length?58:0; const notes=[];
  const pairKey=(a,b)=>[a,b].sort().join('|');
  const seen=new Set();
  for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
    const k=pairKey(ids[a],ids[b]); if(seen.has(k))continue; seen.add(k);
    const P=DB.PAIRINGS.find(p=>pairKey(p[0],p[1])===k);
    if(P){score+=11;notes.push({t:'ok',x:'✓ '+P[2]});}
    const T=DB.TABOOS.find(t=>pairKey(t.pair[0],t.pair[1])===k);
    if(T){score-=(T.level==='avoid'?28:14);notes.push({t:T.level,x:(T.level==='avoid'?'✕ ':'⚠ ')+T.why});}
  }
  // rule: delicate seafood + heavy smoke tech
  const delicate=['uni','scallop','oyster','amaebi'];
  const heavySmoke=state.layers.some(l=>['smoke','char','ash'].includes(l.tech));
  if(heavySmoke && ids.some(i=>delicate.includes(i))) { score-=10; notes.push({t:'warn',x:'⚠ 娇嫩生食海鲜遇重烟熏/炭火,海洋细腻易被烟味盖过'}); }
  // structure bonus: balanced 3-5 layers with acid+texture
  const cats=state.layers.map(l=>byId(l.ing)?.cat);
  if(ids.length>=3&&ids.length<=6){score+=6;}
  if(cats.includes('acid')) score+=4; if(cats.includes('texture')||cats.includes('garnish')) score+=4;
  // season resonance
  const hero=DB.CONTEXT.seasons[state.season].hero;
  if(ids.some(i=>hero.includes(i))){score+=5;notes.push({t:'tip',x:'◆ 呼应了'+({spring:'春',summer:'夏',autumn:'秋',winter:'冬'}[state.season])+'季时令,加分'});}
  score=Math.max(0,Math.min(100,Math.round(score)));
  return {score,notes};
}

/* ---- C4: flavor profile (6 axes) from ingredient flavor/texture keywords ---- */
const FLAVOR_AXES=[
  {key:'sweet',label:'甜',kw:['清甜','甜','蜜','奶香','果香','焦糖','脂甜']},
  {key:'acid',label:'酸',kw:['酸','清冽','柑橘','花酸','发酵']},
  {key:'umami',label:'鲜',kw:['鲜','浓鲜','咸鲜','海洋','umami','矿物']},
  {key:'fat',label:'脂',kw:['油','脂','黄油','奶脂','丰腴','即化','绵密','流心']},
  {key:'aroma',label:'香',kw:['菌','松木','坚果','香料','烟熏','焦香','草本','茴香','麝香','花香','蒜']},
  {key:'bitter',label:'苦·辛',kw:['苦','辛','胡椒','涩','辣']}
];
function flavorProfile(){
  const axes=Object.fromEntries(FLAVOR_AXES.map(a=>[a.key,0]));
  state.layers.forEach(l=>{
    const ing=byId(l.ing); if(!ing)return;
    const words=(ing.flavor||[]).concat(ing.texture||[]);
    FLAVOR_AXES.forEach(a=>{ if(words.some(w=>a.kw.some(k=>w.includes(k)))) axes[a.key]+=1; });
    // technique nudges
    if(['char','smoke','ash','torch'].includes(l.tech)) axes.aroma+=0.6;
    if(['ferment','cure','pickle','cure_gravlax'].includes(l.tech)) axes.acid+=0.5;
    if(['confit','emulsify'].includes(l.tech)) axes.fat+=0.4;
    if(l.tech==='caramelize') axes.sweet+=0.5;
  });
  const max=Math.max(1,...Object.values(axes));
  return FLAVOR_AXES.map(a=>({...a, raw:axes[a.key], v: axes[a.key]/max}));
}
function renderRadar(){
  const el=document.getElementById('flavor-radar'); if(!el)return;
  const prof=flavorProfile();
  if(!state.layers.length){ el.innerHTML='<div style="color:var(--muted);font-size:11px;padding:14px 0">加入食材后,这里显示风味平衡</div>'; return; }

  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r];};
  let grid=''; [0.25,0.5,0.75,1].forEach(f=>{
    const poly=prof.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(',')).join(' ');
    grid+=`<polygon points="${poly}" fill="none" stroke="#3a3830" stroke-width="1" opacity="${f===1?.6:.3}"/>`;
  });

    const [x,y]=pt(i,R); spokes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#3a3830" stroke-width="1" opacity=".4"/>`;
    const [lx,ly]=pt(i,R+16); labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#c8a15a" font-family="var(--sans)">${a.label}</text>`;
  });
  const poly=prof.map((a,i)=>pt(i,R*Math.max(0.06,a.v)).map(x=>x.toFixed(1)).join(',')).join(' ');
  const dots=prof.map((a,i)=>{const [x,y]=pt(i,R*Math.max(0.06,a.v));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#e8c884"/>`;}).join('');
  el.innerHTML=`<svg viewBox="0 0 240 224"><defs><radialGradient id="rdf" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#e8c884" stop-opacity=".38"/><stop offset="100%" stop-color="#c8a15a" stop-opacity=".14"/></radialGradient></defs>${grid}${spokes}<polygon points="${poly}" fill="url(#rdf)" stroke="#e8c884" stroke-width="2"/>${dots}${labels}</svg>`;
}

/* ---- C2: chef critique (judge-style verdict + highlight + fix + one concrete move) ---- */
function critique(score,notes){
  const el=document.getElementById('critique'); if(!el)return;
  if(!state.layers.length){ el.className=''; el.innerHTML=''; return; }
  const ids=state.layers.map(l=>l.ing);
  const cats=state.layers.map(l=>byId(l.ing)?.cat);
  const prof=flavorProfile();
  const has=c=>cats.includes(c);
  const verdict = score>=90?'惊艳之作 · 大胆而克制':score>=78?'成熟的一盘 · 有主张':score>=62?'方向对了 · 还差打磨':score>=45?'尚显生涩 · 需要重心':'散乱 · 先立一个主角';
  // highlight: best pairing note, else the hero/structure
  const okNote=notes.find(n=>n.t==='ok');
  const hi = okNote ? okNote.x.replace('✓ ','') :
    (has('acid')&&(has('meat')||has('seafood')) ? '荤鲜与酸度形成了呼应,入口不腻。' :
     ids.length>=3 ? '层次数量得当,有咀嚼的节奏。' : '选材干净,重点清晰。');
  // improvement: pick the most pressing gap
  let fix, move;
  const avoid=notes.find(n=>n.t==='avoid'), warn=notes.find(n=>n.t==='warn');
  const domFat=prof.find(p=>p.key==='fat').raw, acidV=prof.find(p=>p.key==='acid').raw;
  if(avoid){ fix='有一组食材在风味上强烈打架,拉低了整体。'; move='去掉冲突项之一,或用一层酸/脆把它们隔开。'; }
  else if(warn){ fix='存在一处风味压制的风险,主角的细腻可能被盖住。'; move='把强味那层减量,或换一个更轻的处理(生/渍代替炭烤)。'; }
  else if(domFat>=2&&acidV===0){ fix='油脂偏重却没有酸度收口,后段会腻。'; move='加一层柚子/大黄/沙棘,或一点腌渍果实提亮。'; }
  else if(!has('texture')&&!has('garnish')){ fix='口感偏单一,缺一层脆或点缀。'; move='撒荞麦脆/薄脆瓦片,或点几朵可食用花做视觉与咬感。'; }
  else if(ids.length<3){ fix='层次略少,主张还不够饱满。'; move='再叠 1–2 层呼应主角的配角(参考"找相近名菜")。'; }
  else if(!has('sauce')){ fix='少了一层把各元素连起来的酱汁/基底。'; move='淋一道对味的酱(海鲜配白黄油,红肉配浓缩肉汁)。'; }
  else { fix='结构已相当完整。'; move='想更进一步,就在器皿与技法上做戏剧化处理(玻璃罩烟熏 / 球化爆珠)。'; }
  el.className='on';
  el.innerHTML=`<div class="cq-tag">主厨点评 · CHEF'S NOTE</div>
    <div class="cq-verdict">${verdict}</div>
    <div class="cq-line"><b>亮点</b> ${hi}</div>
    <div class="cq-line"><b>可改进</b> ${fix}</div>
    <div class="cq-line"><b>建议</b> ${move}</div>`;
}
function starStr(score){ const s=score>=90?3:score>=78?2:score>=62?1:0; return '★'.repeat(s).padEnd(3,'☆').split('').map(c=>`<span style="color:${c==='★'?'var(--gold2)':'#3a3830'}">${c}</span>`).join(''); }

/* ---- AI inspiration ---- */
function aiInspire(){
  const ids=state.layers.map(l=>l.ing); const cats=state.layers.map(l=>byId(l.ing)?.cat);
  const has=id=>ids.includes(id); let tip;
  const seasonHero=DB.CONTEXT.seasons[state.season].hero.filter(h=>!has(h));
  if(!ids.length){ const h=seasonHero[0]; const ing=byId(h); tip=`空盘起手,不妨从当季主角「${ing?.name.split(' ')[0]}」开始 —— ${DB.CONTEXT.seasons[state.season].mood}的气息。`; }
  else {
    // compound-graph recommendation (food-pairing hypothesis: shared aroma families)
    const F=window.FDL_FLAVOR;
    const allIds=DB.INGREDIENTS.map(i=>i.id);
    const classic=new Set(DB.PAIRINGS.map(p=>[p[0],p[1]].sort().join('|')));
    const recs=F? F.recommend(ids, allIds, {catOf:id=>byId(id)?.cat, classicPairs:classic, n:5}) : [];
    // prefer a rec that also fills a structural gap (acid / texture) when one is missing
    const needAcid=!cats.includes('acid')&&!cats.includes('fruit');
    const needTex=!cats.includes('texture')&&!cats.includes('garnish');
    let pick=recs[0];
    if(needAcid){ const a=recs.find(r=>['acid','fruit'].includes(byId(r.id)?.cat)); if(a)pick=a; }
    else if(needTex){ const t=recs.find(r=>['texture','garnish'].includes(byId(r.id)?.cat)); if(t)pick=t; }
    if(pick){
      const ing=byId(pick.id);
      const famLabels=(pick.via||[]).map(f=>F.FAMILIES[f]?.label.split('·')[0]).filter(Boolean).slice(0,3);
      if(pick.kind==='classic'){
        const cp=DB.PAIRINGS.find(p=>{const k=[p[0],p[1]].sort().join('|'); return ids.some(cur=>[cur,pick.id].sort().join('|')===k);});
        tip=`试试加入「${ing.name.split(' ')[0]}」—— ${cp?cp[2]:'名厨验证过的经典搭配'}。`;
      } else if(famLabels.length){

/* ---- recipe matching ---- */
function matchDish(){
  if(!state.layers.length){ openModal('<div class="mlabel">提示</div><h2>先做一道菜</h2><div class="story">盘子还是空的 —— 从左侧选几样食材堆叠起来,我再帮你在名厨菜品库里找最相近的一道。</div><button class="btn gold close" data-act="close-modal">好的</button>'); return; }
  const myIng=new Set(state.layers.map(l=>l.ing));
  const myTech=new Set(state.layers.map(l=>l.tech).filter(Boolean));
  let best=null,bestScore=-1;
  DB.SIGNATURE_DISHES.forEach(d=>{
    const di=new Set(d.key_ingredients), dt=new Set(d.techniques||[]);
    let inter=0; myIng.forEach(i=>{if(di.has(i))inter++;});
    const union=new Set([...myIng,...di]).size;
    let s = union? inter/union : 0;            // 食材 Jaccard
    let ti=0; myTech.forEach(t=>{if(dt.has(t))ti++;});
    s = s*0.7 + (dt.size?ti/dt.size:0)*0.18;   // 技法相似
    if(d.vessel===state.vessel) s+=0.08;       // 器皿呼应
    // cuisine/season soft bonus via shared flavor cats
    const myCats=new Set(state.layers.map(l=>byId(l.ing)?.cat));
    const dCats=new Set(d.key_ingredients.map(i=>byId(i)?.cat));
    let ci=0; myCats.forEach(c=>{if(dCats.has(c))ci++;});
    s += (myCats.size?ci/myCats.size:0)*0.12;
    if(s>bestScore){bestScore=s;best=d;}
  });
  const pct=Math.round(bestScore*100);
  const kIngNames=best.key_ingredients.map(i=>byId(i)?.name.split(' ')[0]).join('、');
  const shared=best.key_ingredients.filter(i=>myIng.has(i)).map(i=>byId(i)?.name.split(' ')[0]);
  openModal(`
    <div class="mlabel">最相近的名厨之作 · ${pct}% 神似</div>
    <h2>${best.name}</h2>
    <div class="rest">${best.restaurant} &nbsp;·&nbsp; 主厨 ${best.chef}</div>
    <div class="meta">${best.city} · ${best.cuisine}</div>
    <div class="story">${best.story}</div>
    <div class="sim">核心食材:${kIngNames}<br>${shared.length?'你与它共享了:'+shared.map(s=>`<span class="badge">${s}</span>`).join(''):'你走了一条不同的路 —— 灵感相通,选材各异。'}</div>
    <button class="btn gold close" data-act="close-modal">继续创作</button>
  `);
}

  if(main)layers.push({ing:main.id,tech:pick(DB.TECHNIQUES.filter(t=>t.good_for.includes(main.cat))).id});

function _downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function _canvasToDownload(canvas, filename){
  // toBlob first; if it yields null (rare), fall back to toDataURL. A tainted canvas throws here.
  return new Promise((resolve,reject)=>{
    let settled=false;
    try{
      canvas.toBlob(b=>{
        if(settled)return; settled=true;
        if(b){ _downloadBlob(b,filename); resolve('blob'); return; }
        try{ const u=canvas.toDataURL('image/png'); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); resolve('dataurl'); }
        catch(e){ reject(e); }
      },'image/png');
    }catch(e){ if(!settled){settled=true; reject(e);} }
  });
}
// Rasterize an SVG string to PNG using several strategies; the SVG itself is always downloadable as a last resort.
async function exportSVGtoPNG(svgStr, filename, scale=1){
  const vb=svgStr.match(/viewBox="0 0 (\d+(?:\.\d+)?) (\d+(?:\.\d+)?)"/);
  const w=vb?Math.round(+vb[1]):1080, h=vb?Math.round(+vb[2]):1620;
  if(!/xmlns=/.test(svgStr)) svgStr=svgStr.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
  const pngName=filename, svgName=filename.replace(/\.png$/,'')+'.svg';
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});

  const paint=(source)=>{
    const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#141210'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(source,0,0,c.width,c.height);
    return c;
  };

  // Strategy 1: createImageBitmap(blob) — does NOT taint the canvas even on file://, unlike <img>.
  if(typeof createImageBitmap==='function'){
    try{
      const bmp=await createImageBitmap(blob);
      const c=paint(bmp);
      await _canvasToDownload(c, pngName);
      toast('图片已导出到下载文件夹'); return;
    }catch(e){ /* fall through to <img> */ }
  }

  // Strategy 2: <img> from a blob: URL, then a data: URI.
  const loadImg=(src)=>new Promise((res,rej)=>{
    const img=new Image(); img.decoding='async';
    const to=setTimeout(()=>rej(new Error('timeout')),8000);
    img.onload=()=>{clearTimeout(to);res(img);};
    img.onerror=()=>{clearTimeout(to);rej(new Error('img-load'));};
    img.src=src;
  });
  const blobUrl=URL.createObjectURL(blob);
  const dataUri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  for(const src of [blobUrl,dataUri]){
    try{
      const img=await loadImg(src);
      const c=paint(img);
      await _canvasToDownload(c, pngName);
      if(src===blobUrl) URL.revokeObjectURL(blobUrl);
      toast('图片已导出到下载文件夹'); return;
    }catch(e){ /* try next */ }
  }
  URL.revokeObjectURL(blobUrl);

  // Last resort: hand over the vector SVG itself (opens/prints on any phone, always works).
  _downloadBlob(blob, svgName);
  toast('已导出矢量图 '+svgName+'(PNG 受浏览器限制未生成,SVG 手机可直接打开)');
}
